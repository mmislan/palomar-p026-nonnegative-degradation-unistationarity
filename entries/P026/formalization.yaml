    "divergences": "The formal statement uses literal source normal forms rather than the prose classification; their identification with the Nandan-Nghe-Unterberger families is conventional mathematics in the manuscript. Type II_l return paths are modelled kinetically as reversible unit chains, and their multipliers enter only the source-minimality predicate; minimality forces unit multipliers (manuscript Lemma 2.2). (Top) and source minimality are evaluated on the contracted weak-stem skeleton PaperWeakStemSpecies Q.weakGap and on the return-cycle multipliers, not on the full species set of the separated realization. In the core balance the terminal reaction's own current is replaced by the chain boundary fluxes, so terminal_plus/terminal_minus only tie placeholders to the chain summary. The Type II_l state and positivity predicates select the separated realization or, only when l = 3 and all stems are coincident, the three-species coincident quotient; other non-separated words have no positive states in the encoding (the first conjunct is vacuous there) and are excluded from minimal cores by the inherited source-exhaustion lemma TypeIIL.PaperWeakStemSpecies.source_exhaustion_of_minimal, which is proved in the closure but is not part of the selected statement. Type V is stated over all eight collapsed/linked patterns with arbitrary unit chains, without a separate minimality hypothesis; the manuscript's Theorem 1.1 speaks of source-minimal Type V cores. The name AllZeroParams refers to the all-coincident stem word, not to zero degradation."

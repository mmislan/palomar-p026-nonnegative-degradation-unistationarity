  "status": {
    "scope": "A conjunction of two uniqueness statements. (i) For every l ≥ 3 and every Q : TypeII.PaperRaw.OpenNetwork l with IsPaperTypeIILCore Q, i.e. SourceTop Q.weakGap (the weak-stem split graph is strongly connected and has an internal fork) and SourceMinimal Q (no proper weak-stem restriction retaining (Top) and, when all stems are separated, no rotated return cycle whose restricted stoichiometric matrix is stoichiometrically autocatalytic), any two states x, y : Q.State that satisfy Q.PositiveState and Q.Stationary are equal. In the all-separated branch the state is the core concentration vector together with every internal species of the reversible unit return chains, with mass-action currents plus r * x_r - minus r * (product monomial) for arbitrary positive integer main weights and coefficient-one back products; in the non-separated branch positivity and stationarity require l = 3 with all stems coincident and refer to the three-species network X_i ⇌ m_i X_{i+1} + X_{i+2}. (ii) For every TypeV.Network N (three sectors, each collapsed or linked to its base species by an arbitrary finite UnitChain) any two strictly positive stationary states, including all sector auxiliaries, are equal. In both parts all forward and reverse constants are strictly positive (Rates.plus_pos/minus_pos, UnitChain c_pos/beta_pos, AllZeroParams plus/minus, Network forward_pos/reverse_pos), and every degradation or loss constant (Rates.degrade, UnitChain d, AllZeroParams d0-d2, Network.loss, Sector.linked loss) is only required to be nonnegative, so every support pattern, including the all-zero and all-positive vectors, is covered. The conclusions are uniqueness only; existence, stability and nonminimal Type II_l networks are outside the statement.",
